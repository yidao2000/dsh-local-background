name: Publish to npm

# 信任发布（Trusted Publishing / OIDC）：不存 token、不用 2FA 验证码，
# 由 GitHub 直接向 npm 证明「这个 workflow 跑在这个仓库里」。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        run: npm publish --provenance --access public
