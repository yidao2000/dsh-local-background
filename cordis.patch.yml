# dsh-local-background —— 插入 loader 条目并下发默认配置
#
# 这里只放**所有人通用**的默认值，不要写作者本机的路径。
# dir 留空 = 用插件算出来的内置默认（当前用户的「图片」库）；
# 用户在「插件 → dsh-local-background → 配置」里选过之后，值会写进用户态目录的
# settings.json（不在包里），并立刻生效、不需要重启。
- insert:
    - id: dsh-local-background
      name: dsh-local-background
      config:
        # 壁纸文件夹。留空 = 用插件的内置默认（当前用户的「图片」库，
        # 即 C:\Users\<用户名>\Pictures；目录不存在则退回空串）。
        # 用户在插件界面里选过之后，值会写进 settings.json 并优先于这里。
        dir: ''
        # 每几分钟换一张；0 = 不轮换
        rotateMinutes: 5
        # 背景图压暗遮罩 0~1（图太亮就加大；越小越亮）
        dim: 0.25
        # 主面板不透明度 0~1（越小背景越明显，文字越难读）
        surface: 0.15
        # 弹窗（宿主「设置」等对话框 / 菜单）用宿主的默认（不透明）背景，字更清楚。
        # 想让弹窗也跟着半透明，就在配置页里取消「弹窗用默认（不透明）背景」。
        settingsOpaque: true
